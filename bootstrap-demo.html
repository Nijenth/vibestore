
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap Practice</title>
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4">My Bootstrap Store</h1>

    <div class="row g-3">

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Laptop</h5>
            <p class="card-text">₹75,000</p>
            <button class="btn btn-primary">
              Add to Cart
            </button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Mouse</h5>
            <p class="card-text">₹1,500</p>
            <button class="btn btn-success">
              Add to Cart
            </button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Keyboard</h5>
            <p class="card-text">₹3,500</p>
            <button class="btn btn-danger">
              Add to Cart
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="/src/bootstrap-demo.ts"></script>
</body>
</html>
